log_format ticketdesk '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout ticketdesk;

    # Leave room for multipart framing around the API's default 10 MiB upload limit.
    client_max_body_size 12m;

    location /api/ {
        # Resolve the service name again when a backend container is replaced.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ticketdesk_api http://backend:8000;
        proxy_pass $ticketdesk_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
