x-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend
    env_file:
      - "${TICKETDESK_RUNTIME_ENV_FILE:?Set the path to the production runtime environment file}"
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOCAL_UPLOAD_DIR: /app/uploads
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    volumes:
      - backend_uploads:/app/uploads
    logging: *production-logging

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TICKETDESK_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    logging: *production-logging

volumes:
  backend_uploads:
