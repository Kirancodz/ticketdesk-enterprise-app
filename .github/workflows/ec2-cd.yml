name: TicketDesk EC2 CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: ticketdesk-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate EC2 Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635476133762:role/ticketdesk-github-ecr-publisher
          aws-region: ap-south-1

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^sha-[a-f0-9]{12}-run-[0-9]+-[0-9]+$ ]] || exit 1

      - name: Run EC2 deployment validation through SSM
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-05e5f9475dc812968 \
            --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[\"sudo /home/ec2-user/ticketdesk-enterprise-app/scripts/deploy-ecr.sh check ${IMAGE_TAG}\"]}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-05e5f9475dc812968

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-05e5f9475dc812968 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

