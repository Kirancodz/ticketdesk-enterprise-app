name: TicketDesk ECR Image Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-publish:
    name: Test Build and Publish Images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Frontend
        working-directory: frontend
        run: npm run build

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Backend Test Image
        run: |
          docker build \
            --target test \
            -t ticketdesk-backend-test:ci \
            ./backend

      - name: Run Isolated Backend Tests
        run: |
          docker run --rm \
            --network none \
            --tmpfs /tmp:rw,nosuid,size=128m \
            -e APP_ENV=development \
            -e DATABASE_URL=sqlite:////tmp/ticketdesk_ci.db \
            -e SECRET_KEY=ci-only-placeholder-signing-key-123456789 \
            -e AWS_EC2_METADATA_DISABLED=true \
            -e HOME=/tmp \
            ticketdesk-backend-test:ci \
            python -m pytest -q -p no:cacheprovider tests

      - name: Build Frontend Production Image
        run: |
          docker build \
            -t ticketdesk-frontend:ci \
            ./frontend

      - name: Build Backend Production Image
        run: |
          docker build \
            --target runtime \
            -t ticketdesk-backend:ci \
            ./backend

      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635476133762:role/ticketdesk-github-ecr-publisher
          role-session-name: TicketDeskECRPublish
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Images to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE_TAG="sha-${GITHUB_SHA:0:12}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          FRONTEND_IMAGE="$REGISTRY/ticketdesk-frontend:$IMAGE_TAG"
          BACKEND_IMAGE="$REGISTRY/ticketdesk-backend:$IMAGE_TAG"

          docker tag ticketdesk-frontend:ci "$FRONTEND_IMAGE"
          docker tag ticketdesk-backend:ci "$BACKEND_IMAGE"

          docker push "$FRONTEND_IMAGE"
          docker push "$BACKEND_IMAGE"

          echo "### Published TicketDesk Images" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: $FRONTEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: $BACKEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "No EC2 deployment performed." >> "$GITHUB_STEP_SUMMARY"
