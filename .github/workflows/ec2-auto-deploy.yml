name: TicketDesk Automatic EC2 Deployment

on:
  workflow_run:
    workflows:
      - TicketDesk ECR Image Publish
    types:
      - completed

permissions:
  id-token: write
  contents: read

concurrency:
  group: ticketdesk-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635476133762:role/ticketdesk-github-ecr-publisher
          aws-region: ap-south-1

      - name: Deploy through SSM
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail

          IMAGE_TAG="sha-${SHA:0:12}-run-${RUN_ID}-${ATTEMPT}"

          [[ "$IMAGE_TAG" =~ ^sha-[a-f0-9]{12}-run-[0-9]+-[0-9]+$ ]]

          echo "Deploying image tag: $IMAGE_TAG"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-05e5f9475dc812968 \
            --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[\"sudo /home/ec2-user/ticketdesk-enterprise-app/scripts/deploy-ecr.sh deploy ${IMAGE_TAG}\"],\"executionTimeout\":[\"900\"]}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..90}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-05e5f9475dc812968 \
              --query Status \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed: $STATUS"
                exit 1
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-05e5f9475dc812968 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          test "$STATUS" = "Success"



